<!DOCTYPE html>
<html>
<head>
  <title>Student Registration</title>
  <style>
    body   { font-family: Arial, sans-serif; background: #f4f4f4; }
    .box   { width: 360px; margin: 40px auto; padding: 25px; background: #fff;
             border: 1px solid #ccc; border-radius: 6px; }
    h2     { margin-top: 0; text-align: center; }
    label  { display: block; margin: 12px 0 4px; font-weight: bold; }
    input  { width: 100%; padding: 8px; box-sizing: border-box;
             border: 1px solid #bbb; border-radius: 4px; }
    button { width: 100%; margin-top: 18px; padding: 10px; background: #2b6cb0;
             color: #fff; border: 0; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

<div class="box">
  <h2>Student Registration</h2>

  <form method="post" action="insertion.php">
    <label>Name</label>
    <input type="text" name="name" required>

    <label>Email</label>
    <input type="email" name="email" required>

    <label>Contact</label>
    <input type="text" name="contact" maxlength="10" required>

    <label>City</label>
    <input type="text" name="city" required>

    <button type="submit">Register</button>
  </form>
</div>

</body>
</html>
